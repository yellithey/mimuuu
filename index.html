<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimu ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#efe0d1;
color:#8b1e2d;
font-family:'Cormorant Garamond',serif;
overflow-x:hidden;
touch-action: manipulation;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.hero img{
width:300px;
max-width:90%;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
font-size:2rem;
}

.hero h2{
margin-top:10px;
font-weight:300;
}

button{
margin-top:30px;
padding:12px 30px;
border:1px solid #8b1e2d;
background:transparent;
color:#8b1e2d;
font-size:16px;
}

/* COUNTDOWN */

.countdown{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.boxes{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
min-width:70px;
}

.box span{
font-size:2rem;
display:block;
}

/* GALLERY */

.gallery{
min-height:100vh;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:20px;
}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* SWIPE CARDS */

.cards{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.card{
position:absolute;
width:280px;
height:380px;
background:white;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
font-size:18px;
opacity:0;
transform:scale(0.8);
transition:0.4s;
}

.card.active{
opacity:1;
transform:scale(1);
}

/* ENVELOPE */

.envelope{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.env-btn{
font-size:70px;
cursor:pointer;
}

.letterBox{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.letter{
background:white;
padding:20px;
border-radius:15px;
max-width:500px;
line-height:2;
overflow-y:auto;
max-height:80vh;
}

/* END */

.end{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.end h1{
font-size:2rem;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{font-size:1.5rem;}

.card{width:90%;}

}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<img src="images/pic1.jpg">
<h1>for the girl i'd choose in every universe.</h1>
<h2>Mimu ♡</h2>
<button onclick="next()">open</button>
</section>

<!-- COUNTDOWN -->
<section class="countdown">
<h1>Countdown 🎂</h1>

<div class="boxes">
<div class="box"><span id="d">0</span>Days</div>
<div class="box"><span id="h">0</span>Hours</div>
<div class="box"><span id="m">0</span>Min</div>
<div class="box"><span id="s">0</span>Sec</div>
</div>
</section>

<!-- GALLERY -->
<section class="gallery">
<img src="images/pic1.jpg">
<img src="images/pic2.jpg">
<img src="images/pic3.jpg">
<img src="images/pic4.jpg">
</section>

<!-- CARDS -->
<section class="cards">
<div class="card active">supermarket 🛒</div>
<div class="card">instagram 📱</div>
<div class="card">dahab 🌊</div>
<div class="card">parking 🌙</div>
</section>

<!-- ENVELOPE -->
<section class="envelope">
<div class="env-btn" onclick="openLetter()">✉️</div>
<p>open me</p>
</section>

<div class="letterBox" id="letterBox" onclick="closeLetter()">
<div class="letter" onclick="event.stopPropagation()">

happy birthday ya ahla haga hasaletly f hayaty 🤍

<br><br>

thank you for existing<br><br>
BA7EBKKKKKK YA MIMU 🤍

</div>
</div>

<!-- END -->
<section class="end">
<h1>Thank you for existing.</h1>
<p>— Fufuu ♡</p>
</section>

<script>

/* COUNTDOWN */

let birthday = new Date("June 21, 2026 00:00:00").getTime();

setInterval(()=>{

let now = new Date().getTime();
let d = birthday - now;

document.getElementById("d").innerText = Math.floor(d/(1000*60*60*24));
document.getElementById("h").innerText = Math.floor((d%(1000*60*60*24))/(1000*60*60));
document.getElementById("m").innerText = Math.floor((d%(1000*60*60))/(1000*60));
document.getElementById("s").innerText = Math.floor((d%(1000*60))/1000);

},1000);


/* SWIPE CARDS */

let index = 0;
let cards = document.querySelectorAll(".card");

document.addEventListener("click", ()=>{

cards[index].classList.remove("active");

index = (index + 1) % cards.length;

cards[index].classList.add("active");

});


/* ENVELOPE */

function openLetter(){
document.getElementById("letterBox").style.display="flex";
}

function closeLetter(){
document.getElementById("letterBox").style.display="none";
}

/* NEXT */

function next(){
window.scrollBy({top: window.innerHeight, behavior:"smooth"});
}

</script>

</body>
</html>
